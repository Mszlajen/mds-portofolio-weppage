{% extends "main.html" %}

{% block main_content %}
<div class="site-section"  data-aos="fade">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-7">
                <div class="row mb-5">
                <div class="col-12 ">
                    <h2 class="site-section-heading text-center">Contact</h2>
                </div>
                </div>
            </div>

        </div>
        
        <div class="row">
            <div class="col-lg-12 mb-5">
            <form action="https://forminit.com/f/akp7ej80nc2"
                    accept-charset="UTF-8"
                    enctype="multipart/form-data"
                    method="POST">


                <div class="row form-group">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="text-white" for="firstName">First Name</label>
                    <input type="text" name="fi-sender-firstName" id="firstName" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white" for="lastName">Last Name</label>
                    <input type="text" name="fi-sender-lastName" id="lastName" class="form-control">
                </div>
                </div>

                <div class="row form-group">

                <div class="col-md-12">
                    <label class="text-white" for="email">Email</label> 
                    <input type="email" name="fi-sender-email" id="email" class="form-control" required>
                </div>
                </div> 

                <div class="row form-group">

                <div class="col-md-12">
                    <label class="text-white" for="subject">Subject</label> 
                    <input type="subject" name="fi-text-subject" id="subject" class="form-control" required>
                </div>
                </div>

                <div class="row form-group">
                <div class="col-md-12">
                    <label class="text-white" for="message">Message</label> 
                    <textarea name="message" name="fi-text-message" id="message" cols="30" rows="7" class="form-control" placeholder="Write your notes or questions here..." required></textarea>
                </div>
                </div>

                <div class="row form-group">
                <div class="col-md-12">
                    <input type="submit" value="Send Message" class="btn btn-primary py-2 px-4 text-white">
                </div>
                </div>


            </form>
            </div>
            <!-- <div class="col-lg-3 ml-auto">
            <div class="mb-3">
                <p class="mb-0 font-weight-bold text-white">Address</p>
                <p class="mb-4">203 Fake St. Mountain View, San Francisco, California, USA</p>

                <p class="mb-0 font-weight-bold text-white">Phone</p>
                <p class="mb-4"><a href="#">+1 232 3235 324</a></p>

                <p class="mb-0 font-weight-bold text-white">Email Address</p>
                <p class="mb-0"><a href="#">youremail@domain.com</a></p>

            </div>

            </div> -->
        </div>
    </div>
</div>
{% endblock main_content %}
